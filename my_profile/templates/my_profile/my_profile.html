{% extends 'base.html' %}
{% block title %}My Profile{% endblock %}
{% block content %}
<h2>{{ profile }}</h2>
<p>
    Name: {{ profile.name }} | id: {{ profile.id }}<br>
    {% if profile.premium %}Premium{% else %}User{% endif %}<br>
    Sub Date: {{ profile.sub_date }} | Sub End Date: {{ profile.exp_date }}
</p>
{% endblock %}
