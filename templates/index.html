{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
{{block.super}}
<h2>Collections</h2>
    {% for collection in collection_list %}
    <p>{{collection.username}}'s <strong>{{collection}}</strong> collection:
        <a href="/collection/{{collection.id}}/">{{collection}}</a>
    </p>
    {% endfor %}
{% endblock %}
