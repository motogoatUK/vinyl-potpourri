<div class="toast rounded-0 border-top 0" role="alert" aria-live="assertive" data-bs-autohide="false">
    <div class="arrow-up arrow-danger"></div>
    <div class="w-100 toast-capper bg-danger"></div>
    <div class="toast-header bg-dark text-light">
        <strong class="me-auto">Error!</strong>
        <button type="button" class="ml-2 mb-1 close text-light" data-bs-dismiss="toast" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="toast-body bg-dark">
        {{ message }}
    </div>
</div>
