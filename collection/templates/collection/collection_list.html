{% extends "base.html" %}
{% block title %}Collection List{% endblock %}

{% block content %}
    <h2>Collections</h2>
    <table>
        <thead>
            <tr>
                <td>Name</td>
                <td>Owner</td>
                <td>link</td>
            </tr>
        </thead>
        {% for collection in object_list %}
        <tr>
            <td><strong>{{collection}}</strong></td>
            <td>{{collection.username}}</td>
            <td><a href="/collection/{{collection.id}}/">{{collection}}</a></td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
