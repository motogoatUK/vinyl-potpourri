{% extends "base.html" %}
{% block title %}Record View{% endblock %}

{% block main_content %}
{{ block.super }}

<div class="row">
    <div class="col-12 col-md-6">
        <form method="post" action="{% url 'add_collection' %}" class="form mb-2" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form | crispy }}
            <div class="text-right mt-2">
                <a class="btn btn-dark rounded-0" href="{% url 'collections' %}">Cancel</a>
                <button class="btn btn-outline-info rounded-0" type="submit">Add Collection</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
